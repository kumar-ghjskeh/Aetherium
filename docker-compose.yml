name: aetherium

services:
  aetherium-postgres:
    container_name: aetherium-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${AETHERIUM_POSTGRES_DB:-aetherium_app_dev}
      POSTGRES_USER: ${AETHERIUM_POSTGRES_USER:-aetherium_app}
      POSTGRES_PASSWORD: ${AETHERIUM_POSTGRES_PASSWORD:-aetherium_local_password}
    ports:
      - "${AETHERIUM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - aetherium_postgres_data:/var/lib/postgresql/data
    networks:
      - aetherium_internal
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  aetherium-redis:
    container_name: aetherium-redis
    image: redis:7-alpine
    ports:
      - "${AETHERIUM_REDIS_PORT:-6379}:6379"
    volumes:
      - aetherium_redis_data:/data
    networks:
      - aetherium_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aetherium-minio:
    container_name: aetherium-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AETHERIUM_MINIO_ROOT_USER:-aetherium_minio_root}
      MINIO_ROOT_PASSWORD: ${AETHERIUM_MINIO_ROOT_PASSWORD:-aetherium_minio_dev_password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${AETHERIUM_MINIO_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${AETHERIUM_MINIO_API_PORT:-9000}:9000"
      - "${AETHERIUM_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - aetherium_minio_data:/data
    networks:
      - aetherium_internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  aetherium-minio-init:
    container_name: aetherium-minio-init
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${AETHERIUM_MINIO_ROOT_USER:-aetherium_minio_root}
      MINIO_ROOT_PASSWORD: ${AETHERIUM_MINIO_ROOT_PASSWORD:-aetherium_minio_dev_password}
      AETHERIUM_OBJECT_STORAGE_BUCKET: ${AETHERIUM_OBJECT_STORAGE_BUCKET:-aetherium-private-files-dev}
      AETHERIUM_OBJECT_STORAGE_DERIVED_ASSETS_BUCKET: ${AETHERIUM_OBJECT_STORAGE_DERIVED_ASSETS_BUCKET:-aetherium-derived-assets-dev}
      AETHERIUM_OBJECT_STORAGE_USER_AVATARS_BUCKET: ${AETHERIUM_OBJECT_STORAGE_USER_AVATARS_BUCKET:-aetherium-user-avatars-dev}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set aetherium-local http://aetherium-minio:9000 "$$MINIO_ROOT_USER"
      "$$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing
      "aetherium-local/$$AETHERIUM_OBJECT_STORAGE_BUCKET"; mc mb --ignore-existing
      "aetherium-local/$$AETHERIUM_OBJECT_STORAGE_DERIVED_ASSETS_BUCKET"; mc mb --ignore-existing
      "aetherium-local/$$AETHERIUM_OBJECT_STORAGE_USER_AVATARS_BUCKET";
    depends_on:
      aetherium-minio:
        condition: service_healthy
    networks:
      - aetherium_internal

  aetherium-api:
    container_name: aetherium-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      AETHERIUM_APP_ENV: ${AETHERIUM_APP_ENV:-development}
      AETHERIUM_DATABASE_URL: postgresql+asyncpg://${AETHERIUM_POSTGRES_USER:-aetherium_app}:${AETHERIUM_POSTGRES_PASSWORD:-aetherium_local_password}@aetherium-postgres:5432/${AETHERIUM_POSTGRES_DB:-aetherium_app_dev}
      AETHERIUM_REDIS_URL: redis://aetherium-redis:6379/0
      AETHERIUM_REDIS_KEY_PREFIX: "${AETHERIUM_REDIS_KEY_PREFIX:-aetherium:}"
      AETHERIUM_OBJECT_STORAGE_ENDPOINT: http://aetherium-minio:9000
      AETHERIUM_OBJECT_STORAGE_BUCKET: ${AETHERIUM_OBJECT_STORAGE_BUCKET:-aetherium-private-files-dev}
      AETHERIUM_OBJECT_STORAGE_DERIVED_ASSETS_BUCKET: ${AETHERIUM_OBJECT_STORAGE_DERIVED_ASSETS_BUCKET:-aetherium-derived-assets-dev}
      AETHERIUM_OBJECT_STORAGE_USER_AVATARS_BUCKET: ${AETHERIUM_OBJECT_STORAGE_USER_AVATARS_BUCKET:-aetherium-user-avatars-dev}
      AETHERIUM_S3_ACCESS_KEY_ID: ${AETHERIUM_S3_ACCESS_KEY_ID:-aetherium_minio_root}
      AETHERIUM_S3_SECRET_ACCESS_KEY: ${AETHERIUM_S3_SECRET_ACCESS_KEY:-aetherium_minio_dev_password}
      AETHERIUM_S3_REGION: ${AETHERIUM_S3_REGION:-us-east-1}
      AETHERIUM_SESSION_COOKIE_NAME: ${AETHERIUM_SESSION_COOKIE_NAME:-aetherium_session}
      AETHERIUM_SESSION_SIGNING_SECRET: ${AETHERIUM_SESSION_SIGNING_SECRET:-aetherium-dev-session-secret-change-me}
      AETHERIUM_SESSION_DURATION_SECONDS: ${AETHERIUM_SESSION_DURATION_SECONDS:-1209600}
      AETHERIUM_SESSION_COOKIE_SAMESITE: ${AETHERIUM_SESSION_COOKIE_SAMESITE:-lax}
      AETHERIUM_SESSION_COOKIE_SECURE: ${AETHERIUM_SESSION_COOKIE_SECURE:-false}
      AETHERIUM_AUTH_LOGIN_RATE_LIMIT_ATTEMPTS: ${AETHERIUM_AUTH_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      AETHERIUM_AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AETHERIUM_AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      AETHERIUM_AUTH_REGISTER_RATE_LIMIT_ATTEMPTS: ${AETHERIUM_AUTH_REGISTER_RATE_LIMIT_ATTEMPTS:-3}
      AETHERIUM_AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS: ${AETHERIUM_AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS:-300}
      AETHERIUM_FILE_VAULT_MAX_UPLOAD_BYTES: ${AETHERIUM_FILE_VAULT_MAX_UPLOAD_BYTES:-52428800}
      AETHERIUM_FILE_VAULT_UPLOAD_URL_EXPIRES_SECONDS: ${AETHERIUM_FILE_VAULT_UPLOAD_URL_EXPIRES_SECONDS:-900}
      AETHERIUM_FILE_VAULT_DOWNLOAD_URL_EXPIRES_SECONDS: ${AETHERIUM_FILE_VAULT_DOWNLOAD_URL_EXPIRES_SECONDS:-300}
      AETHERIUM_FILE_VAULT_VERIFY_UPLOADS: ${AETHERIUM_FILE_VAULT_VERIFY_UPLOADS:-false}
      AETHERIUM_CORS_ORIGINS: ${AETHERIUM_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${AETHERIUM_API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      aetherium-postgres:
        condition: service_healthy
      aetherium-redis:
        condition: service_healthy
      aetherium-minio:
        condition: service_healthy
      aetherium-minio-init:
        condition: service_completed_successfully
    networks:
      - aetherium_internal
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  aetherium-web:
    container_name: aetherium-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_AETHERIUM_API_BASE_URL: ${NEXT_PUBLIC_AETHERIUM_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${AETHERIUM_WEB_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - aetherium_web_node_modules:/workspace/node_modules
      - aetherium_web_next:/workspace/apps/web/.next
    depends_on:
      aetherium-api:
        condition: service_healthy
    networks:
      - aetherium_internal
    command: pnpm --filter @aetherium/web dev --hostname 0.0.0.0

networks:
  aetherium_internal:
    name: aetherium_internal

volumes:
  aetherium_minio_data:
  aetherium_postgres_data:
  aetherium_redis_data:
  aetherium_web_next:
  aetherium_web_node_modules:
