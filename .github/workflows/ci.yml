name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      aetherium-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aetherium_ci
          POSTGRES_USER: aetherium_ci
          POSTGRES_PASSWORD: aetherium_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aetherium_ci -d aetherium_ci" --health-interval 10s
          --health-timeout 5s --health-retries 5
      aetherium-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      AETHERIUM_APP_ENV: test
      AETHERIUM_DATABASE_URL: postgresql+asyncpg://aetherium_ci:aetherium_ci_password@localhost:5432/aetherium_ci
      AETHERIUM_REDIS_URL: redis://localhost:6379/0
      AETHERIUM_REDIS_KEY_PREFIX: "aetherium:"
      AETHERIUM_OBJECT_STORAGE_BUCKET: aetherium-ci-files
      AETHERIUM_SESSION_COOKIE_NAME: aetherium_session
      AETHERIUM_SESSION_SIGNING_SECRET: aetherium-ci-session-secret-change-me
      AETHERIUM_SESSION_DURATION_SECONDS: 1209600
      AETHERIUM_SESSION_COOKIE_SAMESITE: lax
      AETHERIUM_SESSION_COOKIE_SECURE: false
      AETHERIUM_AUTH_LOGIN_RATE_LIMIT_ATTEMPTS: 5
      AETHERIUM_AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: 60
      AETHERIUM_AUTH_REGISTER_RATE_LIMIT_ATTEMPTS: 3
      AETHERIUM_AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS: 300
      NEXT_PUBLIC_AETHERIUM_API_BASE_URL: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Run migrations
        run: python -m alembic -c apps/api/alembic.ini upgrade head

      - name: Validate
        run: pnpm run ci
